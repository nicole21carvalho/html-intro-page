<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de apresentação feita na primeira aula de HTML do curso de Análise e Desenvolvimento de Sistemas.">
  <title>Nicole · Introdução ao HTML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <main class="cartao">
    <div class="ilustracao" aria-hidden="true">
      <span class="tag">&lt;h1&gt;</span>
      <span class="tag tag--classe">.ads</span>
      <span class="tag tag--id">#devfront</span>
    </div>

    <!-- Seletor de elemento: h1 -->
    <h1>Nicole</h1>

    <!-- Seletor de classe: .ads (pode ser usado em vários elementos) -->
    <p class="ads">Análise e Desenvolvimento de Sistemas</p>

    <!-- Seletor de id: #devfront (único na página) -->
    <p id="devfront">Desenvolvimento Front-End</p>

    <ul class="ads conceitos" aria-label="O que esta página pratica">
      <li>Estrutura de um documento HTML</li>
      <li>Títulos, parágrafos e listas</li>
      <li>Seletores de elemento, classe e id no CSS</li>
    </ul>

    <a class="botao" href="https://github.com/nicole21carvalho">Ver meus projetos no GitHub →</a>
  </main>
</body>
</html>
